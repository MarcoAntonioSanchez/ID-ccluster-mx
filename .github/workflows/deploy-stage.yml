name: Deploy Theme to STAGE

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme assets
        run: pnpm build

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGE_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add Server to Known Hosts
        run: |
          ssh-keyscan -p ${{ secrets.STAGE_PORT }} \
            ${{ secrets.STAGE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy theme via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.DS_Store' \
            --exclude='node_modules' \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.STAGE_PORT }}" \
            ./ \
            ${{ secrets.STAGE_USERNAME }}@${{ secrets.STAGE_HOST }}:${{ secrets.STAGE_TARGET_DIR }}/

      - name: Post deploy confirmation
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          -p ${{ secrets.STAGE_PORT }} \
          ${{ secrets.STAGE_USERNAME }}@${{ secrets.STAGE_HOST }} \
          "echo 'THEME DEPLOY COMPLETED SUCCESSFULLY'"
